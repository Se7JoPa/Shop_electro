{% extends 'base.html' %}
{% block content %}<div class="breadcrumb"><a href="{{ url_for('catalog') }}">Каталог</a><span>/</span>{{ 'Редактирование' if product else 'Новый товар' }}</div><div class="page-heading"><div><span class="eyebrow">УПРАВЛЕНИЕ КАТАЛОГОМ</span><h1>{{ 'Редактировать товар' if product else 'Добавить товар' }}</h1><p class="muted">Заполните информацию. Её увидят покупатели в каталоге.</p></div></div>
<form method="post" class="panel editor"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><div class="editor-fields"><label class="wide">Название<input name="name" required maxlength="200" value="{{ values.get('name','') }}" placeholder="Например, Samsung Galaxy A55"></label><label>Категория<select name="category_id" required>{% for item in categories %}<option value="{{ item.id }}" {{ 'selected' if values.get('category_id','')|string == item.id|string }}>{{ item.name }}</option>{% endfor %}</select></label><label>Бренд<select name="brand_id" required>{% for item in brands %}<option value="{{ item.id }}" {{ 'selected' if values.get('brand_id','')|string == item.id|string }}>{{ item.name }}</option>{% endfor %}</select></label><label>Цена, ₽<input name="price" required inputmode="decimal" value="{{ values.get('price','') }}" placeholder="0,00"></label><label>Остаток, шт.<input name="stock" type="number" required min="0" max="2147483647" step="1" value="{{ values.get('stock',0) }}"></label><label class="wide">Описание<textarea name="description" rows="4">{{ values.get('description','') }}</textarea></label><label class="wide">Характеристики<textarea name="specs" rows="5" placeholder="Память: 128 ГБ&#10;Цвет: Синий">{{ values.get('specs','') }}</textarea><small>Одна характеристика на строку: название, двоеточие, значение.</small></label></div><div class="editor-footer"><a class="button ghost" href="{{ url_for('detail',product_id=product.id) if product else url_for('catalog') }}">Отмена</a><button class="button" type="submit">Сохранить товар</button></div></form>{% endblock %}
